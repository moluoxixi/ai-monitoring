[package]
name = "ai-monitor-desktop"
version = "1.0.5"
description = "AI Monitor desktop launcher"
authors = ["AI Monitor"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ai_monitor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
serde_json = "1.0"
tauri = { version = "2.11", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
