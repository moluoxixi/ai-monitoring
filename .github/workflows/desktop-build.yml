name: desktop-build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: macOS Intel
            os: macos-15-intel
          - name: macOS Apple Silicon
            os: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Check desktop prerequisites
        run: npm run desktop:check

      - name: Type-check workspaces
        run: npm run typecheck

      - name: Test workspaces
        run: npm test

      - name: Create Tauri test resource directory
        run: |
          node -e "require('node:fs').mkdirSync('apps/desktop/src-tauri/resources', { recursive: true })"

      - name: Test desktop runtime
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build desktop package
        if: matrix.name != 'macOS Intel'
        run: npm run desktop:build

      - name: Build macOS Intel app bundle
        if: matrix.name == 'macOS Intel'
        run: npm run build -w @ai-monitor/desktop -- --bundles app

      - name: Create macOS Intel DMG
        if: matrix.name == 'macOS Intel'
        shell: bash
        run: |
          bundle_root="apps/desktop/src-tauri/target/release/bundle"
          stage_dir="$RUNNER_TEMP/ai-monitor-dmg"
          version="$(node -p "require('./package.json').version")"
          mkdir -p "$stage_dir" "$bundle_root/dmg"
          cp -R "$bundle_root/macos/AI Monitor.app" "$stage_dir/AI Monitor.app"
          ln -s /Applications "$stage_dir/Applications"
          hdiutil create -volname "AI Monitor" -srcfolder "$stage_dir" -ov -format UDZO "$bundle_root/dmg/AI Monitor_${version}_x64.dmg"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ai-monitor-${{ matrix.name }}
          path: apps/desktop/src-tauri/target/release/bundle/
          if-no-files-found: error

  release:
    name: Publish tagged desktop release
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify release tag
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/**/*.msi
            release-artifacts/**/*-setup.exe
            release-artifacts/**/*.dmg
