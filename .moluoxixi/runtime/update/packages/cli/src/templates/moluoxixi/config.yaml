# Moluoxixi Configuration
# Project-level settings for the Moluoxixi workflow system
#
# All values have sensible defaults. Only override what you need.

#-------------------------------------------------------------------------------
# Session Recording
#-------------------------------------------------------------------------------

# Commit message used when auto-committing journal/index changes
# after running add_session.py
session_commit_message: "chore: record journal"

# Maximum lines per journal file before rotating to a new one
max_journal_lines: 2000

#-------------------------------------------------------------------------------
# Session Auto-Commit
#-------------------------------------------------------------------------------

# Auto-commit behavior for session journal + task archive operations.
# - true (default): scripts auto-stage and auto-commit journal / task changes
#   after add_session.py / task.py archive runs.
# - false: scripts do not touch git. Files (journal-*.md, task archive moves)
#   are still written to disk; you decide whether to git add / commit.
#
# Use `false` if your project's .gitignore intentionally excludes `.moluoxixi/`
# and you want session data kept local-only, or if you prefer to review
# staged changes manually before each commit.
#
# Accepts: true / false / yes / no / 1 / 0 / on / off (case-insensitive).
#
# session_auto_commit: true

#-------------------------------------------------------------------------------
# Sub-Agent Context Injection
#-------------------------------------------------------------------------------

# Byte caps for context injected into implement/check sub-agents. A value of
# 0 disables that limit. Oversized UTF-8 text is truncated at a valid character
# boundary; binary files and files beyond the total budget remain as indexed
# notices so the sub-agent can read them explicitly when needed.
#
# context_injection:
#   max_file_bytes: 32768
#   max_artifact_bytes: 65536
#   max_total_bytes: 131072

# Per-turn workflow breadcrumb escape hatch. When the user's prompt contains
# this keyword as a standalone word (case-insensitive), only that turn's
# workflow-state injection is skipped. SessionStart and child context are
# unaffected. Set the value to "" to disable this escape hatch.
#
# prompt_injection:
#   skip_keyword: "no-moluoxixi"

#-------------------------------------------------------------------------------
# Task Lifecycle Hooks
#-------------------------------------------------------------------------------

# Shell commands to run after task lifecycle events.
# Each hook receives TASK_JSON_PATH environment variable pointing to task.json.
# Hook failures print a warning but do not block the main operation.
#
# hooks:
#   after_create:
#     - "echo 'Task created'"
#   after_start:
#     - "echo 'Task started'"
#   after_finish:
#     - "echo 'Task finished'"
#   after_archive:
#     - "echo 'Task archived'"

#-------------------------------------------------------------------------------
# Monorepo / Packages
#-------------------------------------------------------------------------------

# Declare packages for monorepo projects.
# The init-project skill can inspect workspaces, present a package map for
# human review, and persist the approved map. You can also edit it manually.
#
# packages:
#   frontend:
#     path: packages/frontend
#   backend:
#     path: packages/backend
#   docs:
#     path: docs-site
#     type: submodule
#   # For polyrepo / meta-repo layouts (independent .git in each subdir),
#   # mark the package with `git: true`. The runtime treats it as an
#   # independent repository for things like git-context display.
#   webapp:
#     path: ./webapp
#     git: true

# Default package used when --package is not specified.
# default_package: frontend

#-------------------------------------------------------------------------------
# Channel worker OOM guard
#-------------------------------------------------------------------------------
# Default safeguards for `moluoxixi channel spawn` workers. The guard runs
# at spawn time (cleans expired idle workers, then enforces the live-worker
# budget) and inside each supervisor (self-terminates a worker that stays
# continuously idle past `idle_timeout`).
#
# Precedence: CLI flag > env var (MOLUOXIXI_CHANNEL_WORKER_IDLE_TIMEOUT /
# MOLUOXIXI_CHANNEL_MAX_LIVE_WORKERS) > this config > built-in default.
#
# `idle_timeout: 0` disables idle cleanup (workers can sit idle forever
# unless explicitly killed or given `--timeout`).
# `max_live_workers: 0` disables the spawn-time budget check.
#
channel:
  # Additional real directories that channel context/agent files may be read
  # from. Relative entries resolve from the project root.
  # trusted_context_dirs:
  #   - ../shared-moluoxixi-context
  # Automatically trust external targets of top-level .moluoxixi/tasks and
  # .moluoxixi/workspace symlinks. Set false to require explicit entries above.
  # auto_trust_moluoxixi_symlinks: true
  worker_guard:
    idle_timeout: 5m
    max_live_workers: 6

#-------------------------------------------------------------------------------
# Codex (dispatch behavior)
#-------------------------------------------------------------------------------
# Codex-only knob; other platforms ignore it. Default ("auto") dispatches
# Moluoxixi sub-agents. It does not depend on inherited transcripts: the native
# SubagentStart hook injects task context and each role has a pull fallback.
# Set to "inline" to keep work in the main session. "sub-agent" remains an
# alias for "auto"; invalid explicit values safely use inline mode.
# Model keys edited directly in generated `.codex/agents/moluoxixi-*.toml`
# files are preserved during AIRules regeneration.
#
# codex:
#   dispatch_mode: auto  # or "inline"; legacy alias: "sub-agent"
